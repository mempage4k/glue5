# Builds the app for one platform, by hand (Actions > Build > Run workflow),
# from the game.wasm in a draft release of this repository, and puts the
# result into that draft: nothing built from the game is published. Meant
# for forks: see docs/github-build.md.
name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [android, ios, windows, macos, linux-x86_64, linux-aarch64]
        default: android

permissions:
  contents: write

concurrency:
  group: build-${{ inputs.platform }}

jobs:
  build:
    name: ${{ inputs.platform }}
    # Apple: macos-15, whose machines are many more than macos-26's (a job
    # there could be cancelled after waiting for one), with Xcode 26 (below).
    runs-on: ${{ fromJSON('{"ios":"macos-15","macos":"macos-15","android":"ubuntu-24.04","linux-x86_64":"ubuntu-24.04","linux-aarch64":"ubuntu-24.04-arm","windows":"windows-2025"}')[inputs.platform] }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      PLATFORM: ${{ inputs.platform }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The tools each platform needs are installed below, not all of them.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      # A fork behind this project builds without its latest fixes: said,
      # but the build goes on.
      - name: Up to date
        continue-on-error: true
        run: |
          parent=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.parent | select(.) | .full_name + " " + .default_branch')
          [ -n "$parent" ] || exit 0
          read -r name branch <<<"$parent"
          behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...${name%%/*}:$branch" --jq .ahead_by)
          if [ "${behind:-0}" -gt 0 ]; then
              echo "::warning::This copy is $behind commits behind $name, without its latest fixes. On its main page press \"Sync fork\", then \"Update branch\", and build again."
          fi

      - uses: actions/checkout@v5

      - name: Notify ntfy (run started)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh start

      # First, so that a missing or wrong game.wasm fails in seconds. No
      # cache anywhere: the game's code and what is built from it stay in
      # the draft.
      - name: game.wasm from the draft release
        id: game
        run: |
          game=$RUNNER_TEMP/game
          # Windows: D:/a/_temp/game, a path for Git's bash and for cargo alike.
          if [ "$RUNNER_OS" = Windows ]; then game=$(cygpath -m "$game"); fi
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      # Windows: the tasks run in Git's bash, and the game's C is compiled
      # with clang-cl (docs/building.md). The machine has Visual Studio and
      # LLVM, but the build did not find clang-cl on the PATH: LLVM's own,
      # else the one that comes with Visual Studio, on it.
      - name: Git's bash and clang-cl
        if: runner.os == 'Windows'
        run: |
          echo "MISE_BASH_PATH=$(cygpath -w /)bin\\bash.exe" >>"$GITHUB_ENV"
          clang='C:\Program Files\LLVM\bin\clang-cl.exe'
          if [ ! -f "$(cygpath -u "$clang")" ]; then
              clang=
              vswhere=$(cygpath -u 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe')
              [ ! -f "$vswhere" ] ||
                  clang=$("$vswhere" -latest -products '*' -find 'VC\Tools\Llvm\x64\bin\clang-cl.exe' | tr -d '\r' | head -n 1)
          fi
          if [ -z "$clang" ]; then
              echo "::error::clang-cl is not on this machine (neither LLVM nor Visual Studio's): GitHub's Windows image has changed."
              exit 1
          fi
          echo "clang-cl: $clang"
          echo "${clang%\\*}" >>"$GITHUB_PATH"

      # The app needs Xcode 26 (the Icon Composer icon); macos-15's default
      # is 16, beside the Xcode 26 releases that run on macOS 15: the newest.
      - name: Xcode 26
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | grep -E '/Xcode_26(\.[0-9]+)*\.app$' | sort -V | tail -n 1 || true)
          if [ -z "$xcode" ]; then
              echo "::error::No Xcode 26 on this machine: GitHub's macOS image has changed."
              exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >>"$GITHUB_ENV"
          DEVELOPER_DIR=$xcode/Contents/Developer xcodebuild -version

      - name: Room on the disk
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # v5.1.1 (2026-10-04), by its commit: v2 ran on Node 20, which
      # GitHub has deprecated.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: ${{ !startsWith(inputs.platform, 'linux') }}
          install_args: ${{ fromJSON('{"ios":"rust cmake xcodegen","macos":"rust cmake cargo:cargo-packager","android":"rust cmake java gradle android-sdk cargo:cargo-ndk","windows":"rust cmake"}')[inputs.platform] }}
          cache_key_prefix: mise-${{ inputs.platform }}

      # The APK's key, kept in the draft: an update signed with another one
      # would have to replace the app, and that deletes its game folder. The
      # first build makes it: Gradle does not, on the runner. Gradle reads
      # it from ANDROID_USER_HOME.
      - name: Android signing key
        if: inputs.platform == 'android'
        run: |
          yes | mise exec -- sdkmanager --licenses >/dev/null || true
          mkdir -p ~/.android
          echo "ANDROID_USER_HOME=$HOME/.android" >>"$GITHUB_ENV"
          cd ~/.android && "$GITHUB_WORKSPACE/.github/scripts/draft.sh" get "${{ steps.game.outputs.release }}" Glue5-android.keystore
          if [ -f Glue5-android.keystore ]; then
              mv Glue5-android.keystore debug.keystore
          else
              # Android's own debug key, as Gradle would make it.
              mise -C "$GITHUB_WORKSPACE" exec -- keytool -genkeypair -noprompt -keystore debug.keystore \
                  -storepass android -keypass android -alias androiddebugkey \
                  -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Notify ntfy (main build begins, about halfway)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh progress 50 "Preparation is complete; the main ${PLATFORM} build is starting."

      # Kept in $RUNNER_TEMP so that the step below can publish it: a failed
      # build is read there, without downloading the run's log.
      - name: Build
        run: |
          build() {
              case $PLATFORM in
              ios)
                  mise run ios:ipa
                  mv target/ios/Glue5.ipa Glue5-ios.ipa
                  ;;
              windows)
                  mise run build
                  mv target/release/glue5.exe Glue5-windows.exe
                  ;;
              macos)
                  mise run macos:package
                  mv target/package/*.dmg Glue5-macos.dmg
                  ;;
              android)
                  mise run android:build
                  mv target/android/gradle/outputs/apk/release/Glue5-release.apk Glue5-android.apk
                  cp ~/.android/debug.keystore Glue5-android.keystore
                  ;;
              linux-*)
                  mise run linux:container "${PLATFORM#linux-}"
                  mv target/package/*.AppImage "Glue5-$PLATFORM.AppImage"
                  ;;
              esac
          }
          build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Notify ntfy (build finished, nearly done)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh progress 85 "The build completed; the artifact is about to be uploaded."

      - name: Into the draft release
        run: |
          .github/scripts/draft.sh upload "${{ steps.game.outputs.release }}" Glue5-*
          echo "Built for $PLATFORM: the files are in the draft release, under $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases (keep it a draft)." >>"$GITHUB_STEP_SUMMARY"

      # A failed build is read here: the log is pushed to a branch of its own,
      # `ci/build-diagnostics`, so that the errors can be read (and quoted in a
      # fix) without downloading the run's log.
      - name: Publish the build's output when it fails
        if: failure()
        run: |
          set -euo pipefail
          mkdir -p .ci
          if [ -f "${RUNNER_TEMP:-/tmp}/build.log" ]; then
              cp "$RUNNER_TEMP/build.log" .ci/build.log
          else
              echo "no log: the build failed before it started" > .ci/build.log
          fi
          git config user.name "GLUE 5 CI"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q -B ci/build-diagnostics
          git add -f .ci/build.log
          git commit -q -m "ci: the build's output (run ${{ github.run_id }}), for reading"
          git push -q --force origin ci/build-diagnostics

      - name: Notify ntfy (run finished)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/ntfy.sh finish
