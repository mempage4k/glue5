name: GPU tests

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/glue5-gpu/**'
      - 'crates/glue5-runtime/**'
      - 'crates/glue5-game/**'
      - 'patches/**'
      - '.mise/**'
      - '.github/scripts/draft.sh'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - name: Notify ntfy (run started)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh start

      - name: Game wasm from the draft release
        run: |
          game="$RUNNER_TEMP/game"
          .github/scripts/draft.sh fetch "$game"
          echo "GLUE5_GAME_DIR=$game" >>"$GITHUB_ENV"

      # Pin the same reviewed mise-action revision used by the multi-platform Build workflow.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca
        with:
          version: 2026.7.5
          install: true
          install_args: rust cmake
          cache_key_prefix: mise-gpu-tests

      - name: Prepare patched dependencies
        run: |
          set +e
          mise run setup 2>&1 | tee "$RUNNER_TEMP/gpu-setup.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            while IFS= read -r line; do
              line=${line//%/%25}
              echo "::error title=Dependency setup failure::$line"
            done < <(tail -n 8 "$RUNNER_TEMP/gpu-setup.log")
          fi
          {
            echo '### Dependency setup output (last 120 lines)'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/gpu-setup.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Notify ntfy (tests begin, about halfway)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh progress 50 "Dependencies are ready; the GPU test suite is starting."

      - name: Test GPU crate
        run: |
          set +e
          mise exec -- cargo test -p glue5-gpu 2>&1 | tee "$RUNNER_TEMP/gpu-tests.log"
          result=${PIPESTATUS[0]}
          if (( result != 0 )); then
            while IFS= read -r line; do
              line=${line//%/%25}
              echo "::error title=GPU test failure::$line"
            done < <(tail -n 8 "$RUNNER_TEMP/gpu-tests.log")
          fi
          {
            echo '### GPU test output (last 120 lines)'
            echo '```text'
            tail -n 120 "$RUNNER_TEMP/gpu-tests.log"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$result"

      - name: Notify ntfy (tests finished, nearly done)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: bash .github/scripts/ntfy.sh progress 85 "The GPU tests finished; the workflow is wrapping up."

      - name: Notify ntfy (run finished)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: bash .github/scripts/ntfy.sh finish
